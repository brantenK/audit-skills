[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "audit-skills"
version = "0.1.0"
description = "Audit working-paper skills and tools for AI coding agents (Claude Code, Codex CLI, OpenCode). Methodology only - no client data."
readme = "README.md"
license = "AGPL-3.0-or-later"
requires-python = ">=3.10"
authors = [{ name = "Branten Konyana" }]
dependencies = [
  "openpyxl>=3.1",
  "pyyaml>=6.0",
  "typer>=0.12",
  "mcp>=1.2",
]

[project.optional-dependencies]
# Live editing of workbooks open in Excel (Windows or macOS with Excel installed).
live = ["xlwings>=0.30", "pillow>=10"]
dev = ["pytest>=8"]

[project.scripts]
audit-skills = "audit_skills.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/audit_skills"]

[tool.hatch.build.targets.wheel.force-include]
"skills" = "audit_skills/_data/skills"
"methodology" = "audit_skills/_data/methodology"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
